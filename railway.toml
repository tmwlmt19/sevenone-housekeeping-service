# Railway deployment configuration.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"

[deploy]
# Run pending migrations, then start the API bound to the port Railway provides.
# Note: this runs on every deploy; fine for a single instance. If you scale to
# multiple replicas, move migrations to a dedicated release step to avoid races.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
